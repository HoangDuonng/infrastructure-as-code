---
- name: Deploy ArgoCD GitOps Engine
  hosts: masters
  remote_user: ubuntu
  become: false
  tasks:
    - name: 1. Create ArgoCD namespace and install ArgoCD
      shell: |
        kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply --server-side --force-conflicts -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

    - name: 2. Configure ArgoCD server insecure mode (for Nginx Ingress proxying)
      shell: |
        kubectl patch configmap argocd-cmd-params-cm -n argocd --type merge -p '{"data":{"server.insecure":"true"}}'
        kubectl patch deployment argocd-server -n argocd -p '{"spec":{"template":{"spec":{"nodeSelector":{"workload":"infrastructure"}}}}}' || true
        kubectl patch deployment argocd-repo-server -n argocd -p '{"spec":{"template":{"spec":{"nodeSelector":{"workload":"infrastructure"}}}}}' || true
        kubectl patch statefulset argocd-application-controller -n argocd -p '{"spec":{"template":{"spec":{"nodeSelector":{"workload":"infrastructure"}}}}}' || true
        kubectl rollout status deployment/argocd-server -n argocd --timeout=300s

    - name: 3. Create Ingress for ArgoCD Server UI
      shell: |
        kubectl apply -n argocd -f - <<'EOF'
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: argocd-server-ingress
          namespace: argocd
          annotations:
            nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
            nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
        spec:
          ingressClassName: nginx
          rules:
          - host: argocd.{{ ansible_host }}.sslip.io
            http:
              paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: argocd-server
                    port:
                      name: http
        EOF
